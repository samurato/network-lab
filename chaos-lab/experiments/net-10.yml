# Chaos Toolkit experiment (chaos-lab). Run: make run EXP=net-10   Dry run: make dry EXP=net-10
# The chaoslab control guards it (telemetry and management are off limits), arms a rollback watchdog,
# and records the ground truth locally. Catalogue and safety rules: README.md.
version: 1.0.0
title: 'DNS outage: CoreDNS scaled to zero'
description: |
  Cluster DNS disappears. The network is healthy; anything that resolves names in the cluster fails. A test of whether the diagnosis wrongly blames the network.
tags:
- chaos-lab
- kubernetes
- dns
configuration:
  hold:
    type: env
    key: CHAOSLAB_HOLD
    default: 300
extensions:
- name: chaoslab
  id: net-10
  layer: kubernetes
  fault: dns
  random: false
  blast_radius: 1
  extra_seconds: 0
  targets:
  - k8s:kube-system/coredns
  expected:
  - 'Kubernetes: coredns deployment 0/0, scaling event'
  - in-cluster lookups (iperf3-dc2, db.prod) fail; external VIP traffic unaffected
  - no network symptom at all
  detect:
  - signal: web_errors
    label: web 5xx errors (Redis lookup fails)
controls:
- name: chaoslab
  provider:
    type: python
    module: chaoslab.control
steady-state-hypothesis:
  title: Internet users get the real web app, every BGP session is established, every web replica is ready
  probes:
  - type: probe
    name: lab-healthy
    tolerance: 0
    provider:
      type: python
      module: chaoslab.probes
      func: steady_state
method:
- type: action
  name: scale-coredns-to-zero
  provider:
    type: python
    module: chaoslab.k8s
    func: scale
    arguments:
      namespace: kube-system
      deployment: coredns
      replicas: 0
- type: action
  name: hold-fault-window
  provider:
    type: python
    module: chaoslab.state
    func: hold
    arguments:
      seconds: ${hold}
rollbacks:
- type: action
  name: undo-every-fault
  provider:
    type: python
    module: chaoslab.state
    func: rollback
