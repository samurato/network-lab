# Chaos Toolkit experiment (chaos-lab). Run: make run EXP=net-10   Dry run: make dry EXP=net-10
# The chaoslab control guards it (telemetry and management are off limits), arms a rollback watchdog,
# and records the ground truth locally. Catalogue and safety rules: README.md.
version: 1.0.0
title: 'DNS outage: CoreDNS scaled to zero, and a web pod restarted during it'
description: |
  Cluster DNS disappears. The network is healthy; anything that resolves names in the cluster fails. Running web pods keep their Redis connection, so a minute in one web pod is deleted (as any reschedule would): its replacement must resolve redis.prod and cannot, so it fails visibly. A test of whether the diagnosis wrongly blames the network. Rollback scales CoreDNS back to the replicas it had; the new web pod then resolves Redis and recovers.
tags:
- chaos-lab
- kubernetes
- dns
configuration:
  hold:
    type: env
    key: CHAOSLAB_HOLD
    default: 300
extensions:
- name: chaoslab
  id: net-10
  layer: kubernetes
  fault: dns
  random: false
  blast_radius: 2
  extra_seconds: 60
  targets:
  - k8s:kube-system/coredns
  - k8s:prod/web
  expected:
  - 'Kubernetes: coredns deployment 0/0, scaling event'
  - 'after ~60 s: one web pod deleted and recreated; the new pod cannot resolve redis.prod (errors, not ready, or restarts)'
  - in-cluster lookups (iperf3-dc2, db.prod) fail; external VIP traffic mostly unaffected (the old web pods keep Redis)
  - no network symptom at all
  detect:
  - signal: web_errors
    label: web 5xx errors (Redis lookup fails)
  - signal: new_web_pod
    label: a new web pod appears in the traces
  - signal: k8s_event
    label: 'Kubernetes event: CoreDNS scaled to zero'
    reason: ScalingReplicaSet
    namespace: kube-system
    object_prefix: coredns
controls:
- name: chaoslab
  provider:
    type: python
    module: chaoslab.control
steady-state-hypothesis:
  title: Internet users get the real web app, every BGP session is established, every web replica is ready
  probes:
  - type: probe
    name: lab-healthy
    tolerance: 0
    provider:
      type: python
      module: chaoslab.probes
      func: steady_state
method:
- type: action
  name: scale-coredns-to-zero
  provider:
    type: python
    module: chaoslab.k8s
    func: scale
    arguments:
      namespace: kube-system
      deployment: coredns
      replicas: 0
- type: action
  name: hold-before-pod-restart
  provider:
    type: python
    module: chaoslab.state
    func: hold
    arguments:
      seconds: 60
- type: action
  name: delete-web-pod
  provider:
    type: python
    module: chaoslab.k8s
    func: delete_pods
    arguments:
      namespace: prod
      selector: app=web
      count: 1
- type: action
  name: hold-fault-window
  provider:
    type: python
    module: chaoslab.state
    func: hold
    arguments:
      seconds: ${hold}
rollbacks:
- type: action
  name: undo-every-fault
  provider:
    type: python
    module: chaoslab.state
    func: rollback
