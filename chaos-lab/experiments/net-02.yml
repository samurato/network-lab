# Chaos Toolkit experiment (chaos-lab). Run: make run EXP=net-02   Dry run: make dry EXP=net-02
# The chaoslab control guards it (telemetry and management are off limits), arms a rollback watchdog,
# and records the ground truth locally. Catalogue and safety rules: README.md.
version: 1.0.0
title: EVPN overlay BGP session flapping (dc1-leaf2 to dc1-spine1)
description: |
  An unstable BGP session: down 20 s, up 40 s, four times. Each flap withdraws and re-learns EVPN routes.
tags:
- chaos-lab
- network
- bgp-flap
configuration:
  hold:
    type: env
    key: CHAOSLAB_HOLD
    default: 300
extensions:
- name: chaoslab
  id: net-02
  layer: network
  fault: bgp-flap
  random: true
  blast_radius: 1
  extra_seconds: 240
  targets:
  - dc1-leaf2
  expected:
  - net.bgp.session_state on dc1-leaf2 peer 10.1.0.1 cycles IDLE/ESTABLISHED every ~60 s
  - dc1-spine1 sees its session to dc1-leaf2's loopback flap the same way
  - EVPN type-2/3/5 routes from dc1-leaf2 withdrawn and re-advertised (prefix counts saw-tooth)
  - 'pattern: periodic, admin-initiated (shutdown), not a link fault: interfaces stay up'
controls:
- name: chaoslab
  provider:
    type: python
    module: chaoslab.control
steady-state-hypothesis:
  title: Internet users get the real web app, every BGP session is established, every web replica is ready
  probes:
  - type: probe
    name: lab-healthy
    tolerance: 0
    provider:
      type: python
      module: chaoslab.probes
      func: steady_state
method:
- type: action
  name: flap-bgp-neighbor
  provider:
    type: python
    module: chaoslab.eos
    func: bgp_flap
    arguments:
      node: dc1-leaf2
      neighbor: 10.1.0.1
      down: 20
      up: 40
      cycles: 4
- type: action
  name: hold-fault-window
  provider:
    type: python
    module: chaoslab.state
    func: hold
    arguments:
      seconds: ${hold}
rollbacks:
- type: action
  name: undo-every-fault
  provider:
    type: python
    module: chaoslab.state
    func: rollback
