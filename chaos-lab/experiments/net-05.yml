# Chaos Toolkit experiment (chaos-lab). Run: make run EXP=net-05   Dry run: make dry EXP=net-05
# The chaoslab control guards it (telemetry and management are off limits), arms a rollback watchdog,
# and records the ground truth locally. Catalogue and safety rules: README.md.
version: 1.0.0
title: 'Gray failure: 5% loss, 50 ms +- 20 ms on dc1-leaf3''s uplink to dc1-spine1'
description: |
  The link stays up and every protocol stays up, but packets are lost and delayed. dc1-leaf3 is the leaf of dc1-k8s-wk1. The hardest class to diagnose: nothing is 'down'.
tags:
- chaos-lab
- network
- gray-failure
configuration:
  hold:
    type: env
    key: CHAOSLAB_HOLD
    default: 300
extensions:
- name: chaoslab
  id: net-05
  layer: network
  fault: gray-failure
  random: true
  blast_radius: 1
  extra_seconds: 0
  targets:
  - dc1-leaf3:eth1
  expected:
  - no oper-status change, no BGP or OSPF change
  - web latency (trace durations) up for requests served by dc1-k8s-wk1 pods, some errors/retries
  - interface counters normal-looking; the symptom is in the app and in TCP retransmissions
  - netem is applied on the container side of dc1-leaf3 eth1 (Ethernet1), egress
controls:
- name: chaoslab
  provider:
    type: python
    module: chaoslab.control
steady-state-hypothesis:
  title: Internet users get the real web app, every BGP session is established, every web replica is ready
  probes:
  - type: probe
    name: lab-healthy
    tolerance: 0
    provider:
      type: python
      module: chaoslab.probes
      func: steady_state
method:
- type: action
  name: impair-link
  provider:
    type: python
    module: chaoslab.netem
    func: impair
    arguments:
      node: dc1-leaf3
      interfaces:
      - eth1
      loss: 5
      delay: 50ms
      jitter: 20ms
- type: action
  name: hold-fault-window
  provider:
    type: python
    module: chaoslab.state
    func: hold
    arguments:
      seconds: ${hold}
rollbacks:
- type: action
  name: undo-every-fault
  provider:
    type: python
    module: chaoslab.state
    func: rollback
