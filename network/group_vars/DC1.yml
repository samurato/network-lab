# DC1: every DC1 switch (spines, leaves, border gateways)
#
#   AS           65100 on every DC1 switch (iBGP EVPN; spines are route reflectors)
#   Loopback0    10.1.0.0/24    router-id + EVPN peering   spines .1-.2, leaves/BGWs .10 + id
#   Loopback1    10.1.1.0/24    VTEP (VXLAN source)        leaves/BGWs .10 + id
#   Fabric p2p   10.1.255.0/24  leaf/BGW <-> spine /31s, OSPF area 0
#
#   Routing design: FABRIC/routing.yml    VLANs: FABRIC/vlans-vrfs.yml    Servers: ../hosts.yml    Kubernetes: ../../kubernetes/cluster.yml
dc_name: DC1

# ================================================================= SPINES
spine:
  defaults:
    platform: cEOSLab
    bgp_as: 65100
    loopback_ipv4_pool: 10.1.0.0/24
  nodes:
    - name: dc1-spine1
      id: 1
      mgmt_ip: 172.20.20.11/24
    - name: dc1-spine2
      id: 2
      mgmt_ip: 172.20.20.12/24

# ================================================================= LEAVES + BORDER GATEWAYS
# Both are AVD "l3leaf" switches: `defaults` apply to both, uplinks Ethernet1-2 to the spines.
l3leaf:
  defaults:
    platform: cEOSLab
    bgp_as: 65100
    loopback_ipv4_pool: 10.1.0.0/24
    loopback_ipv4_offset: 10
    vtep_loopback_ipv4_pool: 10.1.1.0/24
    uplink_switches: [dc1-spine1, dc1-spine2]
    uplink_ipv4_pool: 10.1.255.0/24
    virtual_router_mac_address: 00:1c:73:00:00:01   # anycast gateway MAC
    spanning_tree_mode: mstp
    # Routing policy in VRF PROD.  Leaves use the K8S route-maps towards their Kubernetes nodes,
    # border gateways the WAN-PROD route-maps towards the WAN routers (sessions: ../../kubernetes/cluster.yml, ../wan.yml).
    structured_config:
      prefix_lists:
        - name: PL-K8S-IN                  # what a Kubernetes node may announce: its pod /24, LB VIPs
          sequence_numbers:
            - sequence: 10
              action: permit 10.11.0.0/16 ge 24 le 24
            - sequence: 20
              action: permit 10.99.0.0/24 ge 32
            - sequence: 30
              action: permit 192.0.2.0/24 ge 32
        - name: PL-WAN-PROD-OUT            # what this DC hands to the WAN: its own subnets, pods and VIPs
          sequence_numbers:
            - sequence: 10
              action: deny 10.10.30.0/24 le 32     # reserved for the database: never reachable from the WAN
            - sequence: 20
              action: permit 10.10.0.0/16 le 32
            - sequence: 30
              action: permit 10.11.0.0/16 le 32
            - sequence: 40
              action: permit 192.0.2.0/24 ge 32  # public VIPs only; internal VIPs (10.99/24) stay in the DCs
        - name: PL-WAN-PROD-IN             # what the WAN may hand back: WAN-site prefixes only
          sequence_numbers:
            - sequence: 10
              action: permit 10.30.0.0/16 le 32
            - sequence: 20
              action: permit 10.31.0.0/16 le 32
            - sequence: 30
              action: permit 198.51.100.0/24 le 32
            - sequence: 40
              action: permit 203.0.113.0/24 le 32
      as_path:
        access_lists:
          - name: AS-DC1-LOCAL             # originated in this DC: by a switch (empty) or a k8s node
            entries:
              - type: permit
                match: ^$
              - type: permit
                match: ^65101$
      route_maps:
        - name: RM-K8S-IN
          sequence_numbers:
            - sequence: 10
              type: permit
              match:
                - ip address prefix-list PL-K8S-IN
        - name: RM-K8S-OUT                 # nodes need no routes from the fabric (default route via the leaf)
          sequence_numbers:
            - sequence: 10
              type: deny
        - name: RM-WAN-PROD-OUT            # own prefixes only: the other DC's routes stay on EVPN
          sequence_numbers:
            - sequence: 10
              type: permit
              match:
                - ip address prefix-list PL-WAN-PROD-OUT
                - as-path AS-DC1-LOCAL
        - name: RM-WAN-PROD-IN
          sequence_numbers:
            - sequence: 10
              type: permit
              match:
                - ip address prefix-list PL-WAN-PROD-IN

  # ---------------------------------------------------------------- leaves
  # filter.tags = which VLANs the leaf carries (tags in FABRIC/vlans-vrfs.yml)
  nodes:
    - name: dc1-leaf1
      id: 1
      mgmt_ip: 172.20.20.13/24
      filter:
        tags: [web]
    - name: dc1-leaf2
      id: 2
      mgmt_ip: 172.20.20.14/24
      filter:
        tags: [web, stretch]
    - name: dc1-leaf3
      id: 3
      mgmt_ip: 172.20.20.15/24
      filter:
        tags: [app]
    - name: dc1-leaf4
      id: 4
      mgmt_ip: 172.20.20.16/24
      filter:
        tags: [app]

  # ---------------------------------------------------------------- border gateways (EVPN gateways)
  # Terminate DC1's EVPN domain and re-originate routes to DC2's gateways with next-hop-self,
  # so DC1 leaves only ever see DC1 VTEPs.
  node_groups:
    - group: DC1_BGWS
      filter:                     # carry the stretched VLAN 150 to DC2
        tags: [stretch]
      mlag: false                 # the pair is all-active via the I-ES below, not MLAG
      evpn_gateway:
        remote_peers:             # eBGP EVPN multihop to the other DC's gateways (AS 65200)
          - hostname: dc2-bgw1
          - hostname: dc2-bgw2
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
        # RFC 9014 Interconnect ES: both gateways share one I-ESI; DF election lets only one
        # forward BUM per VLAN, so stretched-L2 floods can't loop between the DCs.
        all_active_multihoming:
          enabled: true
          enable_d_path: true
          evpn_domain_id_local: "1:1"     # quoted: unquoted 1:1 is a base-60 number in YAML 1.1
          evpn_domain_id_remote: "2:2"
          evpn_ethernet_segment:
            identifier: 0000:0000:0001:0001:0001
            rt_import: 00:00:00:01:00:01
      structured_config:          # peer group for the WAN eBGP sessions (neighbors per gateway below)
        router_bgp:
          peer_groups:
            - name: WAN-PEERS
              send_community: all
              maximum_routes: 12000
          address_family_ipv4:
            peer_groups:
              - name: WAN-PEERS
                activate: true
      nodes:
        - name: dc1-bgw1
          id: 5
          mgmt_ip: 172.20.20.17/24
          structured_config:
            router_bgp:
              neighbors:              # eBGP to the WAN routers (links in FABRIC/cabling.yml)
                - ip_address: 10.255.0.1
                  peer_group: WAN-PEERS
                  remote_as: 64901
                  description: wan1
                - ip_address: 10.255.0.9
                  peer_group: WAN-PEERS
                  remote_as: 64902
                  description: wan2
              address_family_ipv4:
                networks:             # own loopbacks, advertised to the other DC via the WAN
                  - prefix: 10.1.0.15/32   # Loopback0: router-id, EVPN peering
                  - prefix: 10.1.1.15/32   # Loopback1: VTEP
        - name: dc1-bgw2
          id: 6
          mgmt_ip: 172.20.20.18/24
          structured_config:
            router_bgp:
              neighbors:              # eBGP to the WAN routers (links in FABRIC/cabling.yml)
                - ip_address: 10.255.0.3
                  peer_group: WAN-PEERS
                  remote_as: 64901
                  description: wan1
                - ip_address: 10.255.0.11
                  peer_group: WAN-PEERS
                  remote_as: 64902
                  description: wan2
              address_family_ipv4:
                networks:             # own loopbacks, advertised to the other DC via the WAN
                  - prefix: 10.1.0.16/32   # Loopback0: router-id, EVPN peering
                  - prefix: 10.1.1.16/32   # Loopback1: VTEP
