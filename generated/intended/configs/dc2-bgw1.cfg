!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging trap informational
logging vrf MGMT host 172.20.20.250 514
logging format timestamp high-resolution
logging format rfc5424
logging vrf MGMT source-interface Management1
!
hostname dc2-bgw1
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
clock timezone Australia/Sydney
!
vlan 150
   name STRETCH
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc2-spine1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.255.17/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description P2P_dc2-spine2_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.255.19/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description P2P_wan1_eth3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.0.4/31
!
interface Ethernet3.100
   description wan1 eth3.100 VRF PROD
   no shutdown
   encapsulation dot1q vlan 100
   vrf PROD
   ip address 10.255.10.4/31
!
interface Ethernet4
   description P2P_wan2_eth3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.0.12/31
!
interface Ethernet4.100
   description wan2 eth3.100 VRF PROD
   no shutdown
   encapsulation dot1q vlan 100
   vrf PROD
   ip address 10.255.10.12/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.2.0.15/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.2.1.15/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.25/24
!
interface Vlan150
   description STRETCH
   no shutdown
   vrf PROD
   ip address virtual 10.15.0.1/24
!
interface Vxlan1
   description dc2-bgw1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 150 vni 10150
   vxlan vrf PROD vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:02
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip as-path access-list AS-DC2-LOCAL permit ^$ any
ip as-path access-list AS-DC2-LOCAL permit ^65201$ any
!
ip extcommunity-list ECL-EVPN-SOO permit soo 10.2.1.15:1
!
ip prefix-list PL-K8S-IN
   seq 10 permit 10.21.0.0/16 ge 24 le 24
   seq 20 permit 10.99.0.0/24 ge 32
   seq 30 permit 192.0.2.0/24 ge 32
!
ip prefix-list PL-WAN-PROD-IN
   seq 10 permit 10.30.0.0/16 le 32
   seq 20 permit 10.31.0.0/16 le 32
   seq 30 permit 198.51.100.0/24 le 32
   seq 40 permit 203.0.113.0/24 le 32
!
ip prefix-list PL-WAN-PROD-OUT
   seq 10 deny 10.20.30.0/24 le 32
   seq 20 permit 10.20.0.0/16 le 32
   seq 30 permit 10.21.0.0/16 le 32
   seq 40 permit 192.0.2.0/24 ge 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-EVPN-SOO-IN deny 10
   match extcommunity ECL-EVPN-SOO
!
route-map RM-EVPN-SOO-IN permit 20
!
route-map RM-EVPN-SOO-OUT permit 10
   set extcommunity soo 10.2.1.15:1 additive
!
route-map RM-K8S-IN permit 10
   match ip address prefix-list PL-K8S-IN
!
route-map RM-K8S-OUT deny 10
!
route-map RM-WAN-PROD-IN permit 10
   match ip address prefix-list PL-WAN-PROD-IN
!
route-map RM-WAN-PROD-OUT permit 10
   match as-path AS-DC2-LOCAL
   match ip address prefix-list PL-WAN-PROD-OUT
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65200
   router-id 10.2.0.15
   no bgp default ipv4-unicast
   maximum-paths 4
   bgp bestpath d-path
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE bfd
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 15
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65200
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor WAN-PEERS peer group
   neighbor WAN-PEERS send-community
   neighbor WAN-PEERS maximum-routes 12000
   neighbor 10.1.0.15 peer group EVPN-OVERLAY-CORE
   neighbor 10.1.0.15 remote-as 65100
   neighbor 10.1.0.15 description dc1-bgw1_Loopback0
   neighbor 10.1.0.16 peer group EVPN-OVERLAY-CORE
   neighbor 10.1.0.16 remote-as 65100
   neighbor 10.1.0.16 description dc1-bgw2_Loopback0
   neighbor 10.2.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.0.1 description dc2-spine1_Loopback0
   neighbor 10.2.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.0.2 description dc2-spine2_Loopback0
   neighbor 10.255.0.5 peer group WAN-PEERS
   neighbor 10.255.0.5 remote-as 64901
   neighbor 10.255.0.5 description wan1
   neighbor 10.255.0.13 peer group WAN-PEERS
   neighbor 10.255.0.13 remote-as 64902
   neighbor 10.255.0.13 description wan2
   !
   vlan 150
      rd 10.2.0.15:10150
      rd evpn domain remote 10.2.0.15:10150
      route-target both 10150:10150
      route-target import export evpn domain remote 10150:10150
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-IN in
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-OUT out
      domain identifier 2:2
      domain identifier 1:1 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      !
      evpn ethernet-segment domain all
         identifier 0000:0000:0002:0002:0002
         route-target import 00:00:00:02:00:02
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-CORE activate
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor WAN-PEERS activate
      network 10.2.0.15/32
      network 10.2.1.15/32
   !
   vrf PROD
      rd 10.2.0.15:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 10.2.0.15
      neighbor 10.255.10.5 remote-as 64901
      neighbor 10.255.10.5 description wan1 VRF PROD
      neighbor 10.255.10.5 route-map RM-WAN-PROD-IN in
      neighbor 10.255.10.5 route-map RM-WAN-PROD-OUT out
      neighbor 10.255.10.5 send-community
      neighbor 10.255.10.13 remote-as 64902
      neighbor 10.255.10.13 description wan2 VRF PROD
      neighbor 10.255.10.13 route-map RM-WAN-PROD-IN in
      neighbor 10.255.10.13 route-map RM-WAN-PROD-OUT out
      neighbor 10.255.10.13 send-community
      redistribute connected
      !
      address-family ipv4
         neighbor 10.255.10.5 activate
         neighbor 10.255.10.13 activate
!
router ospf 100
   router-id 10.2.0.15
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   max-lsa 12000
   graceful-restart
!
platform tfa
   personality arfa
!
management api models
   provider aft
      ipv4-unicast
      ipv6-unicast

!
end
