!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging trap informational
logging vrf MGMT host 172.20.20.250 514
logging format timestamp high-resolution
logging format rfc5424
logging vrf MGMT source-interface Management1
!
hostname dc1-leaf3
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
clock timezone Australia/Sydney
!
vlan 120
   name APP
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc1-spine1_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.9/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description P2P_dc1-spine2_Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.11/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet5
   description SERVER_dc1-app1_eth1
   no shutdown
   switchport access vlan 120
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Ethernet7
   description k8s dc1-k8s-wk1
   no shutdown
   mtu 1500
   no switchport
   vrf PROD
   ip address 10.10.40.2/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.13/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.1.1.13/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.15/24
!
interface Vlan120
   description APP
   no shutdown
   vrf PROD
   ip address virtual 10.10.20.1/24
!
interface Vxlan1
   description dc1-leaf3_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 120 vni 10120
   vxlan vrf PROD vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip as-path access-list AS-DC1-LOCAL permit ^$ any
ip as-path access-list AS-DC1-LOCAL permit ^65101$ any
!
ip extcommunity-list ECL-EVPN-SOO permit soo 10.1.1.13:1
!
ip prefix-list PL-K8S-IN
   seq 10 permit 10.11.0.0/16 ge 24 le 24
   seq 20 permit 10.99.0.0/24 ge 32
   seq 30 permit 192.0.2.0/24 ge 32
!
ip prefix-list PL-WAN-PROD-IN
   seq 10 permit 10.30.0.0/16 le 32
   seq 20 permit 10.31.0.0/16 le 32
   seq 30 permit 198.51.100.0/24 le 32
   seq 40 permit 203.0.113.0/24 le 32
!
ip prefix-list PL-WAN-PROD-OUT
   seq 10 deny 10.10.30.0/24 le 32
   seq 20 permit 10.10.0.0/16 le 32
   seq 30 permit 10.11.0.0/16 le 32
   seq 40 permit 192.0.2.0/24 ge 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-EVPN-SOO-IN deny 10
   match extcommunity ECL-EVPN-SOO
!
route-map RM-EVPN-SOO-IN permit 20
!
route-map RM-EVPN-SOO-OUT permit 10
   set extcommunity soo 10.1.1.13:1 additive
!
route-map RM-K8S-IN permit 10
   match ip address prefix-list PL-K8S-IN
!
route-map RM-K8S-OUT deny 10
!
route-map RM-WAN-PROD-IN permit 10
   match ip address prefix-list PL-WAN-PROD-IN
!
route-map RM-WAN-PROD-OUT permit 10
   match as-path AS-DC1-LOCAL
   match ip address prefix-list PL-WAN-PROD-OUT
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.1.0.13
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65100
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor 10.1.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.1 description dc1-spine1_Loopback0
   neighbor 10.1.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.2 description dc1-spine2_Loopback0
   !
   vlan 120
      rd 10.1.0.13:10120
      route-target both 10120:10120
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-IN in
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-OUT out
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf PROD
      rd 10.1.0.13:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 10.1.0.13
      neighbor 10.10.40.3 remote-as 65101
      neighbor 10.10.40.3 description k8s dc1-k8s-wk1
      neighbor 10.10.40.3 route-map RM-K8S-IN in
      neighbor 10.10.40.3 route-map RM-K8S-OUT out
      redistribute connected
      !
      address-family ipv4
         neighbor 10.10.40.3 activate
!
router ospf 100
   router-id 10.1.0.13
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   max-lsa 12000
   graceful-restart
!
platform tfa
   personality arfa
!
management api models
   provider aft
      ipv4-unicast
      ipv6-unicast

!
end
