!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc2-leaf1
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
vlan 130
   name DB
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc2-spine1_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.255.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description P2P_dc2-spine2_Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.2.255.3/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet5
   description SERVER_dc2-db1_eth1
   no shutdown
   switchport access vlan 130
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Ethernet7
   description k8s dc2-k8s-cp2
   no shutdown
   mtu 1500
   no switchport
   vrf PROD
   ip address 10.20.40.0/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.2.0.11/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.2.1.11/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.23/24
!
interface Vlan130
   description DB
   no shutdown
   vrf PROD
   ip address virtual 10.20.30.1/24
!
interface Vxlan1
   description dc2-leaf1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 130 vni 10130
   vxlan vrf PROD vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:02
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip as-path access-list AS-DC2-LOCAL permit ^$ any
ip as-path access-list AS-DC2-LOCAL permit ^65201$ any
!
ip extcommunity-list ECL-EVPN-SOO permit soo 10.2.1.11:1
!
ip prefix-list PL-K8S-IN
   seq 10 permit 10.21.0.0/16 ge 24 le 24
   seq 20 permit 10.99.0.0/24 ge 32
   seq 30 permit 192.0.2.0/24 ge 32
!
ip prefix-list PL-WAN-PROD-IN
   seq 10 permit 10.30.0.0/16 le 32
   seq 20 permit 10.31.0.0/16 le 32
   seq 30 permit 198.51.100.0/24 le 32
   seq 40 permit 203.0.113.0/24 le 32
!
ip prefix-list PL-WAN-PROD-OUT
   seq 10 deny 10.20.30.0/24 le 32
   seq 20 permit 10.20.0.0/16 le 32
   seq 30 permit 10.21.0.0/16 le 32
   seq 40 permit 192.0.2.0/24 ge 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-EVPN-SOO-IN deny 10
   match extcommunity ECL-EVPN-SOO
!
route-map RM-EVPN-SOO-IN permit 20
!
route-map RM-EVPN-SOO-OUT permit 10
   set extcommunity soo 10.2.1.11:1 additive
!
route-map RM-K8S-IN permit 10
   match ip address prefix-list PL-K8S-IN
!
route-map RM-K8S-OUT deny 10
!
route-map RM-WAN-PROD-IN permit 10
   match ip address prefix-list PL-WAN-PROD-IN
!
route-map RM-WAN-PROD-OUT permit 10
   match as-path AS-DC2-LOCAL
   match ip address prefix-list PL-WAN-PROD-OUT
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65200
   router-id 10.2.0.11
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65200
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor 10.2.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.0.1 description dc2-spine1_Loopback0
   neighbor 10.2.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.0.2 description dc2-spine2_Loopback0
   !
   vlan 130
      rd 10.2.0.11:10130
      route-target both 10130:10130
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-IN in
      neighbor EVPN-OVERLAY-PEERS route-map RM-EVPN-SOO-OUT out
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
   !
   vrf PROD
      rd 10.2.0.11:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 10.2.0.11
      neighbor 10.20.40.1 remote-as 65201
      neighbor 10.20.40.1 description k8s dc2-k8s-cp2
      neighbor 10.20.40.1 route-map RM-K8S-IN in
      neighbor 10.20.40.1 route-map RM-K8S-OUT out
      redistribute connected
      !
      address-family ipv4
         neighbor 10.20.40.1 activate
!
router ospf 100
   router-id 10.2.0.11
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   max-lsa 12000
   graceful-restart
!
platform tfa
   personality arfa

!
end
