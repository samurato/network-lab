aaa_root:
  disabled: true
as_path:
  access_lists:
  - name: AS-DC1-LOCAL
    entries:
    - type: permit
      match: ^$
    - type: permit
      match: ^65101$
clock:
  timezone: Australia/Sydney
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n   personality arfa\n!\nmanagement api models\n   provider aft\n      ipv4-unicast\n      ipv6-unicast\n"
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-spine1_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.17/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-spine2_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.19/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_wan1_eth1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.0.0/31
  metadata:
    peer: wan1
    peer_interface: eth1
    peer_type: other
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_wan2_eth1
  shutdown: false
  mtu: 9214
  ip_address: 10.255.0.8/31
  metadata:
    peer: wan2
    peer_interface: eth1
    peer_type: other
  switchport:
    enabled: false
- name: Ethernet3.100
  description: wan1 eth1.100 VRF PROD
  shutdown: false
  vrf: PROD
  encapsulation_dot1q:
    vlan: 100
  ip_address: 10.255.10.0/31
  metadata:
    peer_type: l3_interface
- name: Ethernet4.100
  description: wan2 eth1.100 VRF PROD
  shutdown: false
  vrf: PROD
  encapsulation_dot1q:
    vlan: 100
  ip_address: 10.255.10.8/31
  metadata:
    peer_type: l3_interface
hostname: dc1-bgw1
ip_extcommunity_lists:
- name: ECL-EVPN-SOO
  entries:
  - type: permit
    extcommunities: soo 10.1.1.15:1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:01
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
logging:
  trap: informational
  format:
    timestamp: high-resolution
    rfc5424: true
  vrfs:
  - name: MGMT
    source_interface: Management1
    hosts:
    - name: 172.20.20.250
      protocol: udp
      ports:
      - 514
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.1.0.15/32
  ospf_area: 0.0.0.0
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.1.1.15/32
  ospf_area: 0.0.0.0
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: default
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.20.20.17/24
  type: oob
  gateway: 172.20.20.1
metadata:
  is_deployed: true
  platform: cEOSLab
  dc_name: DC1
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-K8S-IN
  sequence_numbers:
  - sequence: 10
    action: permit 10.11.0.0/16 ge 24 le 24
  - sequence: 20
    action: permit 10.99.0.0/24 ge 32
  - sequence: 30
    action: permit 192.0.2.0/24 ge 32
- name: PL-WAN-PROD-OUT
  sequence_numbers:
  - sequence: 10
    action: deny 10.10.30.0/24 le 32
  - sequence: 20
    action: permit 10.10.0.0/16 le 32
  - sequence: 30
    action: permit 10.11.0.0/16 le 32
  - sequence: 40
    action: permit 192.0.2.0/24 ge 32
- name: PL-WAN-PROD-IN
  sequence_numbers:
  - sequence: 10
    action: permit 10.30.0.0/16 le 32
  - sequence: 20
    action: permit 10.31.0.0/16 le 32
  - sequence: 30
    action: permit 198.51.100.0/24 le 32
  - sequence: 40
    action: permit 203.0.113.0/24 le 32
route_maps:
- name: RM-EVPN-SOO-IN
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - extcommunity ECL-EVPN-SOO
  - sequence: 20
    type: permit
- name: RM-EVPN-SOO-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - extcommunity soo 10.1.1.15:1 additive
- name: RM-K8S-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-K8S-IN
- name: RM-K8S-OUT
  sequence_numbers:
  - sequence: 10
    type: deny
- name: RM-WAN-PROD-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-WAN-PROD-OUT
    - as-path AS-DC1-LOCAL
- name: RM-WAN-PROD-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-WAN-PROD-IN
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.1.0.15
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
    bestpath:
      d_path: true
  peer_groups:
  - name: EVPN-OVERLAY-CORE
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 15
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    remote_as: '65100'
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
  - name: WAN-PEERS
    send_community: all
    maximum_routes: 12000
  neighbors:
  - ip_address: 10.2.0.15
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65200'
    metadata:
      peer: dc2-bgw1
    description: dc2-bgw1_Loopback0
  - ip_address: 10.2.0.16
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65200'
    metadata:
      peer: dc2-bgw2
    description: dc2-bgw2_Loopback0
  - ip_address: 10.1.0.1
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.1.0.2
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  - ip_address: 10.255.0.1
    peer_group: WAN-PEERS
    remote_as: '64901'
    description: wan1
  - ip_address: 10.255.0.9
    peer_group: WAN-PEERS
    remote_as: '64902'
    description: wan2
  vlans:
  - id: 150
    metadata:
      tenants:
      - PROD
    rd: 10.1.0.15:10150
    rd_evpn_domain:
      domain: remote
      rd: 10.1.0.15:10150
    route_targets:
      both:
      - 10150:10150
      import_export_evpn_domains:
      - domain: remote
        route_target: 10150:10150
    redistribute_routes:
    - learned
  address_family_evpn:
    domain_identifier: '1:1'
    domain_identifier_remote: '2:2'
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-CORE
      activate: true
      domain_remote: true
    - name: EVPN-OVERLAY-PEERS
      activate: true
      route_map_in: RM-EVPN-SOO-IN
      route_map_out: RM-EVPN-SOO-OUT
    evpn_ethernet_segment:
    - domain: all
      identifier: 0000:0000:0001:0001:0001
      route_target_import: 00:00:00:01:00:01
  address_family_ipv4:
    networks:
    - prefix: 10.1.0.15/32
    - prefix: 10.1.1.15/32
    peer_groups:
    - name: EVPN-OVERLAY-CORE
      activate: false
    - name: EVPN-OVERLAY-PEERS
      activate: false
    - name: WAN-PEERS
      activate: true
  vrfs:
  - name: PROD
    rd: 10.1.0.15:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 10.1.0.15
    neighbors:
    - ip_address: 10.255.10.1
      remote_as: '64901'
      description: wan1 VRF PROD
      send_community: all
      route_map_in: RM-WAN-PROD-IN
      route_map_out: RM-WAN-PROD-OUT
    - ip_address: 10.255.10.9
      remote_as: '64902'
      description: wan2 VRF PROD
      send_community: all
      route_map_in: RM-WAN-PROD-IN
      route_map_out: RM-WAN-PROD-OUT
    redistribute:
      connected:
        enabled: true
    address_family_ipv4:
      neighbors:
      - ip_address: 10.255.10.1
        activate: true
      - ip_address: 10.255.10.9
        activate: true
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.1.0.15
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet1
    - Ethernet2
    max_lsa: 12000
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.20.20.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan150
  description: STRETCH
  shutdown: false
  vrf: PROD
  ip_address_virtual: 10.15.0.1/24
  metadata:
    tenants:
    - PROD
    tags:
    - stretch
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 150
  name: STRETCH
  metadata:
    tenants:
    - PROD
vrfs:
- name: MGMT
  ip_routing: false
- name: PROD
  ip_routing: true
  metadata:
    tenants:
    - PROD
vxlan_interface:
  vxlan1:
    description: dc1-bgw1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 150
        vni: 10150
      vrfs:
      - name: PROD
        vni: 1000
