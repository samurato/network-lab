aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n   personality arfa\n"
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-leaf1_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.2/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-leaf1
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-leaf2_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.6/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-leaf2
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_dc1-leaf3_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.10/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-leaf3
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_dc1-leaf4_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.14/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-leaf4
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_dc1-bgw1_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.18/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-bgw1
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_dc1-bgw2_Ethernet2
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.22/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc1-bgw2
    peer_interface: Ethernet2
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: dc1-spine2
ip_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.1.0.2/32
  ospf_area: 0.0.0.0
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: default
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.20.20.12/24
  type: oob
  gateway: 172.20.20.1
metadata:
  is_deployed: true
  platform: cEOSLab
  dc_name: DC1
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.1.0.2
  maximum_paths:
    paths: 4
  bgp_cluster_id: 10.1.0.2
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    remote_as: '65100'
    update_source: Loopback0
    route_reflector_client: true
    bfd: true
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.1.0.15
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-bgw1
    description: dc1-bgw1_Loopback0
  - ip_address: 10.1.0.16
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-bgw2
    description: dc1-bgw2_Loopback0
  - ip_address: 10.1.0.11
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-leaf1
    description: dc1-leaf1_Loopback0
  - ip_address: 10.1.0.12
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-leaf2
    description: dc1-leaf2_Loopback0
  - ip_address: 10.1.0.13
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-leaf3
    description: dc1-leaf3_Loopback0
  - ip_address: 10.1.0.14
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc1-leaf4
    description: dc1-leaf4_Loopback0
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.1.0.2
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet1
    - Ethernet2
    - Ethernet3
    - Ethernet4
    - Ethernet5
    - Ethernet6
    max_lsa: 12000
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.20.20.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
