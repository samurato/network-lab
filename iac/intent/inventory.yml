# DEVICES: every Arista switch, grouped by DC and role. ansible_host = management IP.
#   Design and settings per DC:     group_vars/DC1.yml, group_vars/DC2.yml
#   Settings shared by both DCs:    group_vars/FABRIC/ (routing, VLANs/VRFs, cabling, management)
all:
  children:
    FABRIC:
      children:
        DC1:
          children:
            DC1_SPINES:
              vars:
                type: spine
              hosts:
                dc1-spine1:
                  ansible_host: 172.20.20.11
                dc1-spine2:
                  ansible_host: 172.20.20.12
            DC1_LEAFS:
              vars:
                type: l3leaf
              hosts:
                dc1-leaf1:
                  ansible_host: 172.20.20.13
                dc1-leaf2:
                  ansible_host: 172.20.20.14
                dc1-leaf3:
                  ansible_host: 172.20.20.15
                dc1-leaf4:
                  ansible_host: 172.20.20.16
            DC1_BGWS:
              vars:
                type: l3leaf
              hosts:
                dc1-bgw1:
                  ansible_host: 172.20.20.17
                dc1-bgw2:
                  ansible_host: 172.20.20.18
        DC2:
          children:
            DC2_SPINES:
              vars:
                type: spine
              hosts:
                dc2-spine1:
                  ansible_host: 172.20.20.21
                dc2-spine2:
                  ansible_host: 172.20.20.22
            DC2_LEAFS:
              vars:
                type: l3leaf
              hosts:
                dc2-leaf1:
                  ansible_host: 172.20.20.23
                dc2-leaf2:
                  ansible_host: 172.20.20.24
            DC2_BGWS:
              vars:
                type: l3leaf
              hosts:
                dc2-bgw1:
                  ansible_host: 172.20.20.25
                dc2-bgw2:
                  ansible_host: 172.20.20.26
