# SOURCE OF TRUTH — workload hosts (Linux containers).  The compiler turns this into
# AVD connected endpoints (leaf access ports) + host addressing.
hosts:
  dc1-web1:
    switch: dc1-leaf1
    port: Ethernet5
    vlan: 110
    ip: 10.10.10.11/24
  dc1-web2:
    switch: dc1-leaf2
    port: Ethernet5
    vlan: 110
    ip: 10.10.10.12/24
  dc1-app1:
    switch: dc1-leaf3
    port: Ethernet5
    vlan: 120
    ip: 10.10.20.13/24
  dc1-app2:
    switch: dc1-leaf4
    port: Ethernet5
    vlan: 120
    ip: 10.10.20.14/24
  dc1-stretch1:
    switch: dc1-leaf2
    port: Ethernet6
    vlan: 150
    ip: 10.15.0.11/24
  dc2-db1:
    switch: dc2-leaf1
    port: Ethernet5
    vlan: 130
    ip: 10.20.30.11/24
  dc2-db2:
    switch: dc2-leaf2
    port: Ethernet5
    vlan: 130
    ip: 10.20.30.12/24
  dc2-stretch1:
    switch: dc2-leaf2
    port: Ethernet6
    vlan: 150
    ip: 10.15.0.12/24
