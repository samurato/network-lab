# Fabric-wide settings (both DCs).
# --- how Ansible reaches the switches (eAPI). Credentials come from env / CI secrets.
ansible_connection: ansible.netcommon.httpapi
ansible_network_os: arista.eos.eos
ansible_user: "{{ lookup('ansible.builtin.env', 'EOS_USER') | default('admin', true) }}"
ansible_password: "{{ lookup('ansible.builtin.env', 'EOS_PASSWORD') | default('admin', true) }}"
ansible_become: true
ansible_become_method: enable
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false

# --- AVD outputs land in iac/build (committed: reviewable intended configs + docs)
fabric_name: FABRIC
root_dir: "{{ inventory_dir }}/../build"
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

# Underlay: OSPF area 0 inside each DC (loopbacks + p2p links).
# Overlay:  iBGP EVPN inside each DC (one AS per DC, spines are route reflectors).
# Between DCs: eBGP — BGWs <-> WAN routers for loopbacks, BGW <-> remote BGW for EVPN.
underlay_routing_protocol: ospf
overlay_routing_protocol: ibgp
underlay_ospf_process_id: 100
underlay_ospf_area: 0.0.0.0

# --- management plane (containerlab mgmt network)
mgmt_interface_settings:
  interface: Management1          # cEOS eth0 is remapped to Management1 (containerlab/static/ceos)
  vrf: MGMT
mgmt_gateway: 172.20.20.1
management_eapi:
  enabled: true
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/"

# --- streaming telemetry: gNMI (OpenConfig + EOS native) in the mgmt VRF, port 6030
custom_structured_configuration_management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
      - name: default
        vrf: MGMT

# --- cEOS-lab dataplane personality (not modelled by AVD; must survive config-replace, matters at boot)
custom_structured_configuration_eos_cli: |
  platform tfa
     personality arfa

# --- physical port roles (cEOS: eth N == EthernetN)
default_interfaces:
  - types: [spine]
    platforms: [default]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]

# --- DCI links: BGW <-> WAN routers (FRR, outside AVD). Not part of OSPF; the eBGP sessions on
#     these links are defined per BGW in DC*_BGWS.yml (AVD only builds them for an eBGP underlay).
l3_edge:
  p2p_links_ip_pools:
    - name: DCI_WAN
      ipv4_pool: 10.255.0.0/24
  p2p_links_profiles:
    - name: DCI_WAN
      ip_pool: DCI_WAN
      include_in_underlay_protocol: false
  p2p_links:
    # wan1
    - {id: 1, profile: DCI_WAN, nodes: [dc1-bgw1, wan1], interfaces: [Ethernet3, eth1], ip: [10.255.0.0/31, 10.255.0.1/31]}
    - {id: 2, profile: DCI_WAN, nodes: [dc1-bgw2, wan1], interfaces: [Ethernet3, eth2], ip: [10.255.0.2/31, 10.255.0.3/31]}
    - {id: 3, profile: DCI_WAN, nodes: [dc2-bgw1, wan1], interfaces: [Ethernet3, eth3], ip: [10.255.0.4/31, 10.255.0.5/31]}
    - {id: 4, profile: DCI_WAN, nodes: [dc2-bgw2, wan1], interfaces: [Ethernet3, eth4], ip: [10.255.0.6/31, 10.255.0.7/31]}
    # wan2
    - {id: 5, profile: DCI_WAN, nodes: [dc1-bgw1, wan2], interfaces: [Ethernet4, eth1], ip: [10.255.0.8/31, 10.255.0.9/31]}
    - {id: 6, profile: DCI_WAN, nodes: [dc1-bgw2, wan2], interfaces: [Ethernet4, eth2], ip: [10.255.0.10/31, 10.255.0.11/31]}
    - {id: 7, profile: DCI_WAN, nodes: [dc2-bgw1, wan2], interfaces: [Ethernet4, eth3], ip: [10.255.0.12/31, 10.255.0.13/31]}
    - {id: 8, profile: DCI_WAN, nodes: [dc2-bgw2, wan2], interfaces: [Ethernet4, eth4], ip: [10.255.0.14/31, 10.255.0.15/31]}
