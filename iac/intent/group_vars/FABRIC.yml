# Fabric-wide settings (both DCs).
# --- how Ansible reaches the switches (eAPI). Credentials come from env / CI secrets.
ansible_connection: ansible.netcommon.httpapi
ansible_network_os: arista.eos.eos
ansible_user: "{{ lookup('ansible.builtin.env', 'EOS_USER') | default('admin', true) }}"
ansible_password: "{{ lookup('ansible.builtin.env', 'EOS_PASSWORD') | default('admin', true) }}"
ansible_become: true
ansible_become_method: enable
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false

# --- AVD outputs land in iac/build (committed: reviewable intended configs + docs)
fabric_name: FABRIC
root_dir: "{{ inventory_dir }}/../build"
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# --- management plane (containerlab mgmt network)
mgmt_interface_settings:
  interface: Management1          # cEOS eth0 is remapped to Management1 (containerlab/static/ceos)
  vrf: MGMT
mgmt_gateway: 172.20.20.1
management_eapi:
  enabled: true
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/"

# --- streaming telemetry: gNMI (OpenConfig + EOS native) in the mgmt VRF, port 6030
custom_structured_configuration_management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
      - name: default
        vrf: MGMT

# --- cEOS-lab dataplane personality (not modelled by AVD; must survive config-replace, matters at boot)
custom_structured_configuration_eos_cli: |
  platform tfa
     personality arfa

# --- physical port roles (cEOS: eth N == EthernetN)
default_interfaces:
  - types: [spine]
    platforms: [default]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]

# --- DCI underlay: BGW <-> WAN routers (FRR, outside AVD).  eBGP, loopbacks only cross the WAN.
l3_edge:
  p2p_links_ip_pools:
    - name: DCI_WAN
      ipv4_pool: 10.255.0.0/24
  p2p_links_profiles:
    - name: DCI_WAN
      ip_pool: DCI_WAN
      include_in_underlay_protocol: true
  p2p_links:
    # wan1
    - {id: 1, profile: DCI_WAN, nodes: [dc1-bgw1, wan1], interfaces: [Ethernet3, eth1], as: ["65105", "64901"]}
    - {id: 2, profile: DCI_WAN, nodes: [dc1-bgw2, wan1], interfaces: [Ethernet3, eth2], as: ["65106", "64901"]}
    - {id: 3, profile: DCI_WAN, nodes: [dc2-bgw1, wan1], interfaces: [Ethernet3, eth3], as: ["65205", "64901"]}
    - {id: 4, profile: DCI_WAN, nodes: [dc2-bgw2, wan1], interfaces: [Ethernet3, eth4], as: ["65206", "64901"]}
    # wan2
    - {id: 5, profile: DCI_WAN, nodes: [dc1-bgw1, wan2], interfaces: [Ethernet4, eth1], as: ["65105", "64902"]}
    - {id: 6, profile: DCI_WAN, nodes: [dc1-bgw2, wan2], interfaces: [Ethernet4, eth2], as: ["65106", "64902"]}
    - {id: 7, profile: DCI_WAN, nodes: [dc2-bgw1, wan2], interfaces: [Ethernet4, eth3], as: ["65205", "64902"]}
    - {id: 8, profile: DCI_WAN, nodes: [dc2-bgw2, wan2], interfaces: [Ethernet4, eth4], as: ["65206", "64902"]}
