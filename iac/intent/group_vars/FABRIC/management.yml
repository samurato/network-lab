# MANAGEMENT (every switch): mgmt VRF, local users, eAPI, gNMI streaming telemetry

# --- Management1 in VRF MGMT on the containerlab mgmt network (cEOS eth0 is remapped to Management1)
mgmt_interface_settings:
  interface: Management1
  vrf: MGMT
mgmt_gateway: 172.20.20.1

# --- local users (lab default admin/admin; hash: openssl passwd -6)
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/

# --- eAPI: how Ansible pushes config
management_eapi:
  enabled: true

# --- gNMI on port 6030 in VRF MGMT: gnmic subscribes here (containerlab/telemetry/gnmic)
custom_structured_configuration_management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
      - name: default
        vrf: MGMT

# --- cEOS-lab dataplane personality (not modelled by AVD; must survive config replace)
custom_structured_configuration_eos_cli: |
  platform tfa
     personality arfa
