# VRFs AND VLANs (both DCs)
#
# A VLAN is created on every leaf / border gateway whose `filter.tags` (DC1.yml, DC2.yml)
# contain one of the VLAN's `tags`.   L2 VNI = 10000 + VLAN id.   L3 VNI of VRF PROD = 1000.
#
#   VLAN  name     subnet / anycast gateway   where
#   110   WEB      10.10.10.1/24              DC1 leaf1, leaf2
#   120   APP      10.10.20.1/24              DC1 leaf3, leaf4
#   130   DB       10.20.30.1/24              DC2 leaf1, leaf2
#   150   STRETCH  10.15.0.1/24               DC1 leaf2 + DC2 leaf2, stretched at L2 via the BGWs
tenants:
  - name: PROD
    mac_vrf_vni_base: 10000
    vrfs:
      - name: PROD
        vrf_vni: 1000
        svis:
          - {id: 110, name: WEB,     tags: [web],     enabled: true, ip_address_virtual: 10.10.10.1/24}
          - {id: 120, name: APP,     tags: [app],     enabled: true, ip_address_virtual: 10.10.20.1/24}
          - {id: 130, name: DB,      tags: [db],      enabled: true, ip_address_virtual: 10.20.30.1/24}
          - {id: 150, name: STRETCH, tags: [stretch], enabled: true, ip_address_virtual: 10.15.0.1/24}
