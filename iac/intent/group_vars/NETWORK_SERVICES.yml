# Tenants / VRFs / VLANs.  `tags` decide which leaves get a VLAN (see node `filter.tags`).
tenants:
  - name: PROD
    mac_vrf_vni_base: 10000          # L2 VNI = 10000 + VLAN id
    vrfs:
      - name: PROD
        vrf_vni: 1000                # L3 VNI (symmetric IRB), identical in both DCs
        svis:
          - {id: 110, name: WEB,     tags: [web],     enabled: true, ip_address_virtual: 10.10.10.1/24}
          - {id: 120, name: APP,     tags: [app],     enabled: true, ip_address_virtual: 10.10.20.1/24}
          - {id: 130, name: DB,      tags: [db],      enabled: true, ip_address_virtual: 10.20.30.1/24}
          - {id: 150, name: STRETCH, tags: [stretch], enabled: true, ip_address_virtual: 10.15.0.1/24}  # L2 stretched DC1<->DC2
