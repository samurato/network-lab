routers:
  wan1: {asn: 64901, loopback: 10.255.255.1, mgmt_ip: 172.20.20.41}
  wan2: {asn: 64902, loopback: 10.255.255.2, mgmt_ip: 172.20.20.42}
links:                       # WAN-internal links (not touching the fabric)
