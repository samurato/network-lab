!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-bgw2
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
vlan 150
   name STRETCH
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc1-spine1_Ethernet6
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.21/31
!
interface Ethernet2
   description P2P_dc1-spine2_Ethernet6
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.23/31
!
interface Ethernet3
   description P2P_wan1_eth2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.0.2/31
!
interface Ethernet4
   description P2P_wan2_eth2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.255.0.10/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.16/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.1.1.16/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.18/24
!
interface Vlan150
   description STRETCH
   no shutdown
   vrf PROD
   ip address virtual 10.15.0.1/24
!
interface Vxlan1
   description dc1-bgw2_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 150 vni 10150
   vxlan vrf PROD vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.1.0.0/24 eq 32
   seq 20 permit 10.1.1.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65106
   router-id 10.1.0.16
   no bgp default ipv4-unicast
   maximum-paths 4
   bgp bestpath d-path
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE bfd
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 15
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.1.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.1 remote-as 65100
   neighbor 10.1.0.1 description dc1-spine1_Loopback0
   neighbor 10.1.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.2 remote-as 65100
   neighbor 10.1.0.2 description dc1-spine2_Loopback0
   neighbor 10.1.255.20 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.20 remote-as 65100
   neighbor 10.1.255.20 description dc1-spine1_Ethernet6
   neighbor 10.1.255.22 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.22 remote-as 65100
   neighbor 10.1.255.22 description dc1-spine2_Ethernet6
   neighbor 10.2.0.15 peer group EVPN-OVERLAY-CORE
   neighbor 10.2.0.15 remote-as 65205
   neighbor 10.2.0.15 description dc2-bgw1_Loopback0
   neighbor 10.2.0.16 peer group EVPN-OVERLAY-CORE
   neighbor 10.2.0.16 remote-as 65206
   neighbor 10.2.0.16 description dc2-bgw2_Loopback0
   neighbor 10.255.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.0.3 remote-as 64901
   neighbor 10.255.0.3 description wan1
   neighbor 10.255.0.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.255.0.11 remote-as 64902
   neighbor 10.255.0.11 description wan2
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 150
      rd 10.1.0.16:10150
      rd evpn domain remote 10.1.0.16:10150
      route-target both 10150:10150
      route-target import export evpn domain remote 10150:10150
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
      neighbor EVPN-OVERLAY-PEERS activate
      domain identifier 1:1
      domain identifier 2:2 remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      !
      evpn ethernet-segment domain all
         identifier 0000:0000:0001:0001:0001
         route-target import 00:00:00:01:00:01
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-CORE activate
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf PROD
      rd 10.1.0.16:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 10.1.0.16
      redistribute connected
!
platform tfa
   personality arfa

!
end
