!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf4
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
vlan 120
   name APP
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc1-spine1_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.13/31
!
interface Ethernet2
   description P2P_dc1-spine2_Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.15/31
!
interface Ethernet5
   description SERVER_dc1-app2_eth1
   no shutdown
   switchport access vlan 120
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.14/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.1.1.14/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.16/24
!
interface Vlan120
   description APP
   no shutdown
   vrf PROD
   ip address virtual 10.10.20.1/24
!
interface Vxlan1
   description dc1-leaf4_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 120 vni 10120
   vxlan vrf PROD vni 1000
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.1.0.0/24 eq 32
   seq 20 permit 10.1.1.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65104
   router-id 10.1.0.14
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.1.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.1 remote-as 65100
   neighbor 10.1.0.1 description dc1-spine1_Loopback0
   neighbor 10.1.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.2 remote-as 65100
   neighbor 10.1.0.2 description dc1-spine2_Loopback0
   neighbor 10.1.255.12 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.12 remote-as 65100
   neighbor 10.1.255.12 description dc1-spine1_Ethernet4
   neighbor 10.1.255.14 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.14 remote-as 65100
   neighbor 10.1.255.14 description dc1-spine2_Ethernet4
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 120
      rd 10.1.0.14:10120
      route-target both 10120:10120
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf PROD
      rd 10.1.0.14:1000
      route-target import evpn 1000:1000
      route-target export evpn 1000:1000
      router-id 10.1.0.14
      redistribute connected
!
platform tfa
   personality arfa

!
end
