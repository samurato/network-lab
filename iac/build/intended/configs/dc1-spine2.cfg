!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-spine2
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
      vrf MGMT
   provider eos-native
!
interface Ethernet1
   description P2P_dc1-leaf1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.2/31
!
interface Ethernet2
   description P2P_dc1-leaf2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.6/31
!
interface Ethernet3
   description P2P_dc1-leaf3_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.10/31
!
interface Ethernet4
   description P2P_dc1-leaf4_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.14/31
!
interface Ethernet5
   description P2P_dc1-bgw1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.18/31
!
interface Ethernet6
   description P2P_dc1-bgw2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.255.22/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.0.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.20.12/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.1.0.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.20.20.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.1.0.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.1.0.11 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.11 remote-as 65101
   neighbor 10.1.0.11 description dc1-leaf1_Loopback0
   neighbor 10.1.0.12 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.12 remote-as 65102
   neighbor 10.1.0.12 description dc1-leaf2_Loopback0
   neighbor 10.1.0.13 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.13 remote-as 65103
   neighbor 10.1.0.13 description dc1-leaf3_Loopback0
   neighbor 10.1.0.14 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.14 remote-as 65104
   neighbor 10.1.0.14 description dc1-leaf4_Loopback0
   neighbor 10.1.0.15 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.15 remote-as 65105
   neighbor 10.1.0.15 description dc1-bgw1_Loopback0
   neighbor 10.1.0.16 peer group EVPN-OVERLAY-PEERS
   neighbor 10.1.0.16 remote-as 65106
   neighbor 10.1.0.16 description dc1-bgw2_Loopback0
   neighbor 10.1.255.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.3 remote-as 65101
   neighbor 10.1.255.3 description dc1-leaf1_Ethernet2
   neighbor 10.1.255.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.7 remote-as 65102
   neighbor 10.1.255.7 description dc1-leaf2_Ethernet2
   neighbor 10.1.255.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.11 remote-as 65103
   neighbor 10.1.255.11 description dc1-leaf3_Ethernet2
   neighbor 10.1.255.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.15 remote-as 65104
   neighbor 10.1.255.15 description dc1-leaf4_Ethernet2
   neighbor 10.1.255.19 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.19 remote-as 65105
   neighbor 10.1.255.19 description dc1-bgw1_Ethernet2
   neighbor 10.1.255.23 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.255.23 remote-as 65106
   neighbor 10.1.255.23 description dc1-bgw2_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
platform tfa
   personality arfa

!
end
