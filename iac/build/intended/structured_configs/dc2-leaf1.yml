aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n   personality arfa\n"
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc2-spine1_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.2.255.1/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc2-spine1
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc2-spine2_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.2.255.3/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  metadata:
    peer: dc2-spine2
    peer_interface: Ethernet1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet5
  description: SERVER_dc2-db1_eth1
  shutdown: false
  spanning_tree_portfast: edge
  metadata:
    peer: dc2-db1
    peer_interface: eth1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
    mode: access
    access_vlan: 130
hostname: dc2-leaf1
ip_extcommunity_lists:
- name: ECL-EVPN-SOO
  entries:
  - type: permit
    extcommunities: soo 10.2.1.11:1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:02
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.2.0.11/32
  ospf_area: 0.0.0.0
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.2.1.11/32
  ospf_area: 0.0.0.0
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: default
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.20.20.23/24
  type: oob
  gateway: 172.20.20.1
metadata:
  is_deployed: true
  platform: cEOSLab
  dc_name: DC2
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
route_maps:
- name: RM-EVPN-SOO-IN
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - extcommunity ECL-EVPN-SOO
  - sequence: 20
    type: permit
- name: RM-EVPN-SOO-OUT
  sequence_numbers:
  - sequence: 10
    type: permit
    set:
    - extcommunity soo 10.2.1.11:1 additive
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65200'
  router_id: 10.2.0.11
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    remote_as: '65200'
    update_source: Loopback0
    bfd: true
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.2.0.1
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc2-spine1
    description: dc2-spine1_Loopback0
  - ip_address: 10.2.0.2
    peer_group: EVPN-OVERLAY-PEERS
    metadata:
      peer: dc2-spine2
    description: dc2-spine2_Loopback0
  vlans:
  - id: 130
    metadata:
      tenants:
      - PROD
    rd: 10.2.0.11:10130
    route_targets:
      both:
      - 10130:10130
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
      route_map_in: RM-EVPN-SOO-IN
      route_map_out: RM-EVPN-SOO-OUT
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: PROD
    rd: 10.2.0.11:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 10.2.0.11
    redistribute:
      connected:
        enabled: true
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.2.0.11
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet1
    - Ethernet2
    max_lsa: 12000
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.20.20.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan130
  description: DB
  shutdown: false
  vrf: PROD
  ip_address_virtual: 10.20.30.1/24
  metadata:
    tenants:
    - PROD
    tags:
    - db
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 130
  name: DB
  metadata:
    tenants:
    - PROD
vrfs:
- name: MGMT
  ip_routing: false
- name: PROD
  ip_routing: true
  metadata:
    tenants:
    - PROD
vxlan_interface:
  vxlan1:
    description: dc2-leaf1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 130
        vni: 10130
      vrfs:
      - name: PROD
        vni: 1000
