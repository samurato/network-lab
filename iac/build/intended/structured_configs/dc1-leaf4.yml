aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n   personality arfa\n"
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc1-spine1_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.13/31
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet4
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc1-spine2_Ethernet4
  shutdown: false
  mtu: 9214
  ip_address: 10.1.255.15/31
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet4
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet5
  description: SERVER_dc1-app2_eth1
  shutdown: false
  spanning_tree_portfast: edge
  metadata:
    peer: dc1-app2
    peer_interface: eth1
    peer_type: server
    peer_key: servers
  switchport:
    enabled: true
    mode: access
    access_vlan: 120
hostname: dc1-leaf4
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:01
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.1.0.14/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.1.1.14/32
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: default
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.20.20.16/24
  type: oob
  gateway: 172.20.20.1
metadata:
  is_deployed: true
  platform: cEOSLab
  dc_name: DC1
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.1.0.0/24 eq 32
  - sequence: 20
    action: permit 10.1.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65104'
  router_id: 10.1.0.14
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.1.255.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet4
  - ip_address: 10.1.255.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet4
  - ip_address: 10.1.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.1.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 120
    metadata:
      tenants:
      - PROD
    rd: 10.1.0.14:10120
    route_targets:
      both:
      - 10120:10120
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: PROD
    rd: 10.1.0.14:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 10.1.0.14
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.20.20.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan120
  description: APP
  shutdown: false
  vrf: PROD
  ip_address_virtual: 10.10.20.1/24
  metadata:
    tenants:
    - PROD
    tags:
    - app
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 120
  name: APP
  metadata:
    tenants:
    - PROD
vrfs:
- name: MGMT
  ip_routing: false
- name: PROD
  ip_routing: true
  metadata:
    tenants:
    - PROD
vxlan_interface:
  vxlan1:
    description: dc1-leaf4_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 120
        vni: 10120
      vrfs:
      - name: PROD
        vni: 1000
