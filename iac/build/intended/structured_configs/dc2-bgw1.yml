aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
eos_cli: "platform tfa\n   personality arfa\n"
ethernet_interfaces:
- name: Ethernet1
  description: P2P_dc2-spine1_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.2.255.17/31
  metadata:
    peer: dc2-spine1
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_dc2-spine2_Ethernet5
  shutdown: false
  mtu: 9214
  ip_address: 10.2.255.19/31
  metadata:
    peer: dc2-spine2
    peer_interface: Ethernet5
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_wan1_eth3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.0.4/31
  metadata:
    peer: wan1
    peer_interface: eth3
    peer_type: other
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_wan2_eth3
  shutdown: false
  mtu: 9214
  ip_address: 10.255.0.12/31
  metadata:
    peer: wan2
    peer_interface: eth3
    peer_type: other
  switchport:
    enabled: false
hostname: dc2-bgw1
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:02
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$1yhH1WS8WkcVeAPu$k56vaTChE1oj5UfsfHE79tAY7LNGwb7baQ9Zm7qzygUqGJIC40/uVsQHBoYfOjg7emTdLFo0OTdC77nRiv9Mn/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.2.0.15/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.2.1.15/32
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: default
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.20.20.25/24
  type: oob
  gateway: 172.20.20.1
metadata:
  is_deployed: true
  platform: cEOSLab
  dc_name: DC2
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.2.0.0/24 eq 32
  - sequence: 20
    action: permit 10.2.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65205'
  router_id: 10.2.0.15
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
    bestpath:
      d_path: true
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  - name: EVPN-OVERLAY-CORE
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 15
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.2.255.16
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: dc2-spine1
    description: dc2-spine1_Ethernet5
  - ip_address: 10.2.255.18
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: dc2-spine2
    description: dc2-spine2_Ethernet5
  - ip_address: 10.2.0.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: dc2-spine1
    description: dc2-spine1_Loopback0
  - ip_address: 10.2.0.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: dc2-spine2
    description: dc2-spine2_Loopback0
  - ip_address: 10.1.0.15
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65105'
    metadata:
      peer: dc1-bgw1
    description: dc1-bgw1_Loopback0
  - ip_address: 10.1.0.16
    peer_group: EVPN-OVERLAY-CORE
    remote_as: '65106'
    metadata:
      peer: dc1-bgw2
    description: dc1-bgw2_Loopback0
  - ip_address: 10.255.0.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '64901'
    metadata:
      peer: wan1
    description: wan1
  - ip_address: 10.255.0.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '64902'
    metadata:
      peer: wan2
    description: wan2
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 150
    metadata:
      tenants:
      - PROD
    rd: 10.2.0.15:10150
    rd_evpn_domain:
      domain: remote
      rd: 10.2.0.15:10150
    route_targets:
      both:
      - 10150:10150
      import_export_evpn_domains:
      - domain: remote
        route_target: 10150:10150
    redistribute_routes:
    - learned
  address_family_evpn:
    domain_identifier: '2:2'
    domain_identifier_remote: '1:1'
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-CORE
      activate: true
      domain_remote: true
    evpn_ethernet_segment:
    - domain: all
      identifier: 0000:0000:0002:0002:0002
      route_target_import: 00:00:00:02:00:02
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
    - name: EVPN-OVERLAY-CORE
      activate: false
  vrfs:
  - name: PROD
    rd: 10.2.0.15:1000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 1000:1000
      export:
      - address_family: evpn
        route_targets:
        - 1000:1000
    router_id: 10.2.0.15
    redistribute:
      connected:
        enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.20.20.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan150
  description: STRETCH
  shutdown: false
  vrf: PROD
  ip_address_virtual: 10.15.0.1/24
  metadata:
    tenants:
    - PROD
    tags:
    - stretch
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 150
  name: STRETCH
  metadata:
    tenants:
    - PROD
vrfs:
- name: MGMT
  ip_routing: false
- name: PROD
  ip_routing: true
  metadata:
    tenants:
    - PROD
vxlan_interface:
  vxlan1:
    description: dc2-bgw1_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      vlans:
      - id: 150
        vni: 10150
      vrfs:
      - name: PROD
        vni: 1000
