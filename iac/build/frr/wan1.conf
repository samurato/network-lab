! Intended config for wan1 — rendered by iac/ansible/roles/frr_router (intent/wan.yml + AVD l3_edge)
hostname wan1
log syslog informational
!
interface lo
 ip address 10.255.255.1/32
exit
!
interface eth1
 description to dc1-bgw1 Ethernet3
 ip address 10.255.0.1/31
exit
!
interface eth2
 description to dc1-bgw2 Ethernet3
 ip address 10.255.0.3/31
exit
!
interface eth3
 description to dc2-bgw1 Ethernet3
 ip address 10.255.0.5/31
exit
!
interface eth4
 description to dc2-bgw2 Ethernet3
 ip address 10.255.0.7/31
exit
!
interface eth5
 description to wan2 eth5
 ip address 10.255.1.0/31
exit
!
router bgp 64901
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.255.0.0 remote-as 65105
 neighbor 10.255.0.0 description dc1-bgw1
 neighbor 10.255.0.2 remote-as 65106
 neighbor 10.255.0.2 description dc1-bgw2
 neighbor 10.255.0.4 remote-as 65205
 neighbor 10.255.0.4 description dc2-bgw1
 neighbor 10.255.0.6 remote-as 65206
 neighbor 10.255.0.6 description dc2-bgw2
 neighbor 10.255.1.1 remote-as 64902
 neighbor 10.255.1.1 description wan2
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
 exit-address-family
exit
!
