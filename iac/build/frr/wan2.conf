! Intended config for wan2 — rendered by iac/ansible/roles/frr_router (intent/wan.yml + AVD l3_edge)
hostname wan2
log syslog informational
!
interface lo
 ip address 10.255.255.2/32
exit
!
interface eth1
 description to dc1-bgw1 Ethernet4
 ip address 10.255.0.9/31
exit
!
interface eth2
 description to dc1-bgw2 Ethernet4
 ip address 10.255.0.11/31
exit
!
interface eth3
 description to dc2-bgw1 Ethernet4
 ip address 10.255.0.13/31
exit
!
interface eth4
 description to dc2-bgw2 Ethernet4
 ip address 10.255.0.15/31
exit
!
interface eth5
 description to wan1 eth5
 ip address 10.255.1.1/31
exit
!
router bgp 64902
 bgp router-id 10.255.255.2
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.255.0.8 remote-as 65100
 neighbor 10.255.0.8 description dc1-bgw1
 neighbor 10.255.0.10 remote-as 65100
 neighbor 10.255.0.10 description dc1-bgw2
 neighbor 10.255.0.12 remote-as 65200
 neighbor 10.255.0.12 description dc2-bgw1
 neighbor 10.255.0.14 remote-as 65200
 neighbor 10.255.0.14 description dc2-bgw2
 neighbor 10.255.1.0 remote-as 64901
 neighbor 10.255.1.0 description wan1
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
 exit-address-family
exit
!
