# Edge proxy for the web app, in the Internet-user host's network namespace (198.51.100.11).
# Every request is a new connection to the public VIP (no upstream keep-alive), so the WAN routers'
# layer-4 ECMP hash spreads them over all paths, DCs and nodes.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
  server {
    listen 80;
    location / {
      proxy_pass http://192.0.2.10:80;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
      proxy_next_upstream off;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }
    # A broken path must read as "network down", not as an nginx error.
    error_page 502 503 504 /down.html;
    location = /down.html {
      root /usr/share/nginx/html;
      internal;
      add_header Cache-Control "no-store" always;
    }
  }
}
