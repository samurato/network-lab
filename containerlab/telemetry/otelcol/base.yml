# OTel Collector gateway (lab side): the Elastic Distribution of OpenTelemetry (EDOT) Collector.
# automation/lab layers ONE profile on top as profile.yml (see docs/elastic.md § Collector profiles):
#   local         nothing leaves the lab (default; also what a plain `containerlab deploy` runs)
#   elastic       elasticsearch exporter straight to ELASTIC_ES_URL (what runs today)
#   elastic-otlp  OTLP to an Elastic Managed OTLP endpoint (ELASTIC_OTLP_ENDPOINT; ready for later)
# Every signal gets the data contract (host.name, device, lab) and a data_stream.dataset, so in Elastic
# it lands in <type>-<dataset>.otel-default: metrics-gnmi.otel-default, logs-gnmi.state.otel-default, ...
# The switches' state changes (routes, BGP, LLDP, VTEPs, MACs) come from gnmic as a JSON-lines file in
# /var/lib/netops-state, a directory both containers bind (the EDOT Collector has no TCP log receiver).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/state:            # read offsets, next to the file: a restart or redeploy doesn't re-send old lines
    directory: /var/lib/netops-state/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  file_log/gnmi_state:           # gnmic's state output (automation/telemetry/gnmic.base.yml, outputs.state)
    include:
      - /var/lib/netops-state/gnmi-state*.json   # with the rotated files, so nothing is lost on a rotation
    start_at: beginning
    storage: file_storage/state
    retry_on_failure:            # when the exporter pushes back, wait and retry: never drop state changes
      enabled: true
    operators:
      - type: json_parser
        timestamp:               # the device's time of the change; Elastic keeps the read time as observed_timestamp
          parse_from: attributes.timestamp
          layout_type: epoch
          layout: ns
      # the switch becomes the record's resource, as on the metrics (the receiver groups records by resource).
      # host.name must be a resource attribute: a logsdb index has its own top-level host.name, which hides
      # a record-level one.
      - type: copy
        from: attributes.tags.source
        to: resource["host.name"]
      - type: move
        from: attributes.tags.source
        to: resource["device"]
      - type: move
        from: attributes.tags.site
        to: resource["site"]
      - type: move
        from: attributes.tags.role
        to: resource["role"]
      - type: move
        from: attributes.tags.vendor
        to: resource["vendor"]
  file_log/bmp:                  # pmbmpd's BMP feed from the WAN routers (one JSON object per BMP message)
    include:
      - /var/lib/netops-state/bmp*.json
    start_at: beginning
    storage: file_storage/state
    retry_on_failure:
      enabled: true
    operators:
      - type: json_parser
      - type: filter             # pmbmpd's own file markers, not BMP messages
        expr: 'attributes.event_type in ["log_init", "log_close"]'
      - type: time_parser        # when the collector received it; the router's own stamp stays in bmp.router_timestamp
        if: 'attributes.timestamp_arrival != nil'
        parse_from: attributes.timestamp_arrival
        layout_type: epoch
        layout: s.us
      # bmp_router is the router's management address (network/wan.yml mgmt_ip): name it, as on the switches.
      - type: add
        if: 'attributes.bmp_router == "172.20.20.41"'
        field: resource["host.name"]
        value: wan1
      - type: add
        if: 'attributes.bmp_router == "172.20.20.42"'
        field: resource["host.name"]
        value: wan2
      - type: copy
        if: 'resource["host.name"] != nil'
        from: resource["host.name"]
        to: resource["device"]
      - type: add
        field: resource["site"]
        value: wan
      - type: add
        field: resource["role"]
        value: wan
      - type: add
        field: resource["vendor"]
        value: frr
  prometheus/self:               # the collector's own metrics (queue size, refused / failed sends)
    config:
      scrape_configs:
        - job_name: otelcol
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:8888

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  cumulative_to_delta/histograms:  # Elasticsearch takes delta histograms only (the web app's SDK sends cumulative)
    include:
      metric_types:
        - histogram
  transform/gnmi_state:          # one gnmic event -> one flat log record in logs-gnmi.state.otel-*
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - attributes["log.file.name"] != nil and IsMatch(attributes["log.file.name"], "^gnmi-state")
        statements:
          - merge_maps(attributes, attributes["tags"], "upsert") where attributes["tags"] != nil
          - merge_maps(attributes, attributes["values"], "upsert") where attributes["values"] != nil
          - set(attributes["state.deleted_paths"], attributes["deletes"]) where attributes["deletes"] != nil
          - set(attributes["data_stream.dataset"], "gnmi.state")
          - set(body, Concat([resource.attributes["host.name"], attributes["subscription-name"], attributes["op"]], " "))
          - delete_matching_keys(attributes, "^(tags|values|deletes|name|timestamp|source|log\\.file\\.name)$")
  transform/bmp:                 # one BMP message -> one flat log record in logs-bgp.bmp.otel-*
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - attributes["log.file.name"] != nil and IsMatch(attributes["log.file.name"], "^bmp")
        statements:
          - set(attributes["data_stream.dataset"], "bgp.bmp")
          - set(attributes["peer_asn"], Int(attributes["peer_asn"])) where attributes["peer_asn"] != nil
          - set(attributes["med"], Int(attributes["med"])) where attributes["med"] != nil
          - set(attributes["bmp.router_timestamp"], attributes["timestamp"]) where attributes["timestamp"] != nil
          - set(body, Concat([resource.attributes["host.name"], attributes["bmp_msg_type"]], " "))
          - set(body, Concat([resource.attributes["host.name"], attributes["log_type"], attributes["ip_prefix"], "as_path", attributes["as_path"], "rib", attributes["bmp_rib_type"]], " ")) where attributes["bmp_msg_type"] == "route_monitor" and attributes["as_path"] != nil
          - set(body, Concat([resource.attributes["host.name"], attributes["log_type"], attributes["ip_prefix"], "rib", attributes["bmp_rib_type"]], " ")) where attributes["bmp_msg_type"] == "route_monitor" and attributes["as_path"] == nil
          - set(body, Concat([resource.attributes["host.name"], attributes["bmp_msg_type"], "peer", attributes["peer_ip"], "AS", Format("%d", [attributes["peer_asn"]])], " ")) where IsMatch(attributes["bmp_msg_type"], "^peer_")
          - delete_matching_keys(attributes, "^(seq|event_type|rd_origin|timestamp|timestamp_arrival|bmp_router_port|log\\.file\\.name)$")
  transform/contract:            # data contract: every signal carries host.name (+ device) and lab
    metric_statements:
      - context: resource
        statements:
          - set(attributes["host.name"], attributes["source"]) where attributes["source"] != nil
          - set(attributes["device"], attributes["source"]) where attributes["source"] != nil
          - set(attributes["lab"], "netops")
          - set(attributes["data_stream.dataset"], "gnmi") where attributes["service.name"] == "gnmic"
          - set(attributes["data_stream.dataset"], "otelcol") where attributes["service.name"] == "elastic-otel-collector"
    trace_statements:
      - context: resource
        statements:
          - set(attributes["lab"], "netops")
    log_statements:
      - context: resource
        statements:
          - set(attributes["lab"], "netops")

exporters:
  debug:
    verbosity: basic

service:
  extensions:
    - health_check
    - file_storage/state
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    metrics:
      receivers:
        - otlp
        - prometheus/self
      processors:
        - memory_limiter
        - cumulative_to_delta/histograms
        - transform/contract
      exporters:
        - debug
    traces:                      # web pods (kubernetes/terraform/apps.tf) send OTLP traces here
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/contract
      exporters:
        - debug
    logs:
      receivers:
        - otlp
        - file_log/gnmi_state
        - file_log/bmp
      processors:
        - memory_limiter
        - transform/gnmi_state
        - transform/bmp
        - transform/contract
      exporters:
        - debug
