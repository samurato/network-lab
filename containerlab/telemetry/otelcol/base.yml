# OTel Collector gateway (lab side). Elastic export is layered on by elastic.yml.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {}
  transform/contract:            # data contract: every signal carries device + lab
    metric_statements:
      - context: resource
        statements:
          - set(attributes["device"], attributes["source"]) where attributes["source"] != nil
          - set(attributes["lab"], "netops")

exporters:
  debug: {verbosity: basic}
  prometheus:                    # local sanity check: curl localhost:9464/metrics
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion: {enabled: true}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [transform/contract, batch]
      exporters: [debug, prometheus]
