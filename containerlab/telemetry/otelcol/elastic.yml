# Profile `elastic`: every pipeline also goes straight to Elasticsearch (elasticsearch exporter, OTel-native
# mapping -> <type>-<dataset>.otel-default data streams).  automation/lab picks it when ELASTIC_ES_URL and
# ELASTIC_API_KEY are set, and writes both into secrets/ (git-ignored, mode 600) — never into this file.
extensions:
  file_storage/queue:            # survives an Elastic outage or a collector restart
    directory: /tmp/otelcol-queue
    create_directory: true

exporters:
  elasticsearch/elastic:
    endpoints:
      - ${file:/etc/otelcol/secrets/es_url}
    api_key: ${file:/etc/otelcol/secrets/api_key}
    sending_queue:               # the exporter's defaults (10 requests, 10 s flush) held about 33 docs/s and
      enabled: true              # dropped the rest when full; sized here in items, blocking instead of dropping
      storage: file_storage/queue
      num_consumers: 10
      sizer: items
      queue_size: 200000
      block_on_overflow: true
      batch:
        flush_timeout: 1s
        sizer: items
        min_size: 1000
        max_size: 10000

service:
  extensions:
    - health_check
    - file_storage/state           # base.yml: gnmic state-file offsets (a profile's list replaces base's)
    - file_storage/queue
  pipelines:
    metrics:
      exporters:
        - debug
        - elasticsearch/elastic
    traces:
      exporters:
        - debug
        - elasticsearch/elastic
    logs:
      exporters:
        - debug
        - elasticsearch/elastic
