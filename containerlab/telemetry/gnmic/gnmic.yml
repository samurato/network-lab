processors:
  now:
    event-override-ts:
      precision: ns
  names:
    event-starlark:
      source: |
        NAMES = {
          "/interfaces/interface/state/oper-status": "net.if.oper_status",
          "/interfaces/interface/subinterfaces/subinterface/ipv4/state/mtu": "net.if.ipv4_mtu",
          "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state": "net.bgp.session_state",
          "/components/component/state/memory/available": "net.mem.available",
          "/components/component/state/memory/utilized": "net.mem.utilized",
          "/lldp/interfaces/interface/neighbors/neighbor/state/system-name": "net.lldp.neighbor.system_name",
          "/lldp/interfaces/interface/neighbors/neighbor/state/port-id": "net.lldp.neighbor.port_id",
        }
        COUNTERS = "/interfaces/interface/state/counters/"
        PREFIXES = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes/"
        OSPF = "/Sysdb/routing/ospf/status/"
        OPER = {"UP": 1}
        BGP = {"IDLE": 1, "CONNECT": 2, "ACTIVE": 3, "OPENSENT": 4, "OPENCONFIRM": 5, "ESTABLISHED": 6}

        def plain_path(p):       # drop YANG module / origin prefixes: "eos_native:/a/openconfig-x:b" -> "/a/b"
          return "/".join([s.split(":")[-1] for s in p.split("/")])

        def short(p):
          if p in NAMES:
            return NAMES[p]
          if p.startswith(COUNTERS):
            leaf = p[len(COUNTERS):]
            if leaf == "last-update":
              return None
            return "net.if." + leaf.replace("-", "_")   # net.if.in_octets ("in" alone is an ES|QL keyword)
          if p.startswith(PREFIXES):   # best-paths, best-ecmp-paths, received-pre-policy: not kept (series budget)
            leaf = p[len(PREFIXES):]
            if leaf in ["received", "installed", "sent"]:
              return "net.bgp.prefixes." + leaf
            return None
          if p.startswith(OSPF) and p.endswith("/numLsa"):
            return "net.ospf.lsa_count"
          return None

        def apply(*events):
          for e in events:
            values = {}
            for k, v in e.values.items():
              p = plain_path(k)
              n = short(p)
              if n == None:
                continue
              if n == "net.if.oper_status" and type(v) == "string":
                v = OPER.get(v, 0)
              elif n == "net.bgp.session_state" and type(v) == "string":
                v = BGP.get(v, 0)
              elif n == "net.ospf.lsa_count":   # /Sysdb/routing/ospf/status/<vrf>/instanceStatus/<instance>/numLsa
                parts = p.split("/")
                e.tags["network-instance_name"] = parts[5]
                e.tags["ospf_instance"] = parts[7]
              values[n] = v
            e.values = values
          return events
  numbers:
    event-convert:
      value-names:
        - .*
      type: float
  state-docs:
    event-starlark:
      source: |
        TABLES = {
          "eos_native:/Sysdb/vxlan/remoteVtepHwConfig/vtepConfig/": "vtep",
          "eos_native:/Smash/bridging/status/smashFdbStatus/": "mac",
        }

        def leaf(p):
          return "state." + p.split("/")[-1].split(":")[-1].replace("-", "_")

        def plain(v):
          if type(v) == "dict" and "value" in v:   # EOS-native numbers come wrapped: {"value": 1006}
            v = v["value"]
          if type(v) == "int" and (v > 9007199254740991 or v < -9007199254740991):
            return str(v)        # 64-bit AFT ids: past a double's precision and Elasticsearch's long
          if type(v) in ["dict", "list"]:
            return str(v)
          return v

        def table_entry(p):      # -> (kind, entry, field) for an EOS-native table path, else None
          for root, kind in TABLES.items():
            if p.startswith(root):
              rest = p[len(root):].split("/")
              return (kind, rest[0], "_".join(rest[1:]))
          return None

        def entry_tags(tags, kind, entry):
          t = {k: v for k, v in tags.items()}
          if kind == "mac":      # <mac>_<fid>; the fid is the VLAN for a bridged VLAN
            t["mac"] = entry.rsplit("_", 1)[0]
            t["fid"] = entry.rsplit("_", 1)[-1]
          else:
            t[kind] = entry
          return t

        def apply(*events):
          out = []
          for e in events:
            values = {}
            entries = {}
            for k, v in e.values.items():
              te = table_entry(k)
              if te == None:
                values[leaf(k)] = plain(v)
              else:
                entries.setdefault((te[0], te[1]), {})["state." + te[2]] = plain(v)
            deletes = []
            for d in e.deletes:
              te = table_entry(d)
              if te == None:
                deletes.append(d)
              else:
                t = entry_tags(e.tags, te[0], te[1])
                t["op"] = "delete"
                out.append(Event(e.name, timestamp=e.timestamp, tags=t, deletes=[d]))
            for key, vals in entries.items():
              t = entry_tags(e.tags, key[0], key[1])
              t["op"] = "update"
              out.append(Event(e.name, timestamp=e.timestamp, tags=t, values=vals))
            if values or deletes:
              e.values = values
              e.deletes = deletes
              e.tags["op"] = "delete" if deletes else "update"
              out.append(e)
          return out
  used-ports:
    event-drop:
      condition: |
        .tags.interface_name != null and (
          (.tags.source == "dc1-bgw1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet3.100", "Ethernet4", "Ethernet4.100", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-bgw2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet3.100", "Ethernet4", "Ethernet4.100", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-leaf1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet7", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-leaf2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet6", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-leaf3" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet7", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-leaf4" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet7", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc1-spine1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet4", "Ethernet5", "Ethernet6", "Loopback0") | not))
          or (.tags.source == "dc1-spine2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet4", "Ethernet5", "Ethernet6", "Loopback0") | not))
          or (.tags.source == "dc2-bgw1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet3.100", "Ethernet4", "Ethernet4.100", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc2-bgw2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet3", "Ethernet3.100", "Ethernet4", "Ethernet4.100", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc2-leaf1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet7", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc2-leaf2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet6", "Ethernet7", "Loopback0", "Loopback1", "Vxlan1") | not))
          or (.tags.source == "dc2-spine1" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet6", "Loopback0") | not))
          or (.tags.source == "dc2-spine2" and (.tags.interface_name | IN("Ethernet1", "Ethernet2", "Ethernet5", "Ethernet6", "Loopback0") | not))
        )
outputs:
  otel:
    type: otlp
    endpoint: 172.20.20.250:4317
    protocol: grpc
    strip-leading-underscore: true
    strings-as-attributes: true
    resource-tag-keys:
