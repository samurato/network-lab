! pmbmpd (pmacct BMP collector) for the WAN routers. One JSON object per BMP message, appended to a file in
! the shared state directory, which the OTel Collector tails (base.yml, file_log/bmp) into logs-bgp.bmp.otel-*.
bmp_daemon_ip: 0.0.0.0
bmp_daemon_port: 1790
bmp_daemon_max_peers: 10
bmp_daemon_msglog_file: /var/lib/netops-state/bmp.json
bmp_daemon_msglog_output: json
timestamps_utc: true
timestamps_since_epoch: true
