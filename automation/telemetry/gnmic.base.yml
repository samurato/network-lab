# gnmic collector (hand-maintained base): Arista cEOS OpenConfig paths -> OTLP -> otelcol (-> Elastic),
# plus a Prometheus output on :9464 that is only a local debug tap (curl localhost:9464/metrics on the lab host).
# automation/render.py adds a per-device "used-ports" filter and writes containerlab/telemetry/gnmic/gnmic.yml.
# Credentials: GNMIC_USERNAME / GNMIC_PASSWORD env, set in netops.clab.yml from EOS_USER / EOS_PASSWORD (default admin).
encoding: json_ietf
log: true
loader:
  type: file
  path: /etc/gnmic/targets.yml   # containerlab/telemetry/gnmic/targets.yml
  interval: 30s

subscriptions:
  if-counters:
    paths:
      - /interfaces/interface/state/counters
    stream-mode: sample
    sample-interval: 10s
  if-state:
    paths:
      - /interfaces/interface/state/oper-status
    stream-mode: on-change
  bgp-state:
    paths:
      - /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state
    stream-mode: on-change
  bgp-prefixes:
    paths:
      - /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes
    stream-mode: sample
    sample-interval: 30s
  platform:
    paths:
      - /components/component/cpu/utilization/state/instant
      - /components/component/state/memory
    stream-mode: sample
    sample-interval: 30s
  lldp:
    paths:
      - /lldp/interfaces/interface/neighbors/neighbor/state/system-name
      - /lldp/interfaces/interface/neighbors/neighbor/state/port-id
    stream-mode: on-change

processors:
  # cEOS keeps the device timestamp of a value that has not changed, so an idle counter would be re-sent with the
  # same old timestamp every sample (Elastic drops it as a duplicate, and it looks stale). Stamp collection time.
  now:
    event-override-ts:
      precision: ns              # OTLP timestamps are nanoseconds; "ms" would land the data in 1970
  # OpenConfig enums -> numbers so each state is ONE time series the agent can threshold on.
  #   oper-status: UP=1, anything else=0      session-state: BGP FSM IDLE=1 .. ESTABLISHED=6
  states:
    event-starlark:
      source: |
        OPER = {"UP": 1}
        BGP = {"IDLE": 1, "CONNECT": 2, "ACTIVE": 3, "OPENSENT": 4, "OPENCONFIRM": 5, "ESTABLISHED": 6}
        def apply(*events):
          for e in events:
            for k, v in e.values.items():
              if type(v) != "string":
                continue
              if k.endswith("oper-status"):
                e.values[k] = OPER.get(v, 0)
              elif k.endswith("session-state"):
                e.values[k] = BGP.get(v, 0)
          return events
  numbers:
    event-convert:
      value-names: [".*"]
      type: float

outputs:
  otel:
    type: otlp
    endpoint: 172.20.20.250:4317
    protocol: grpc
    metric-prefix: gnmi
    strip-leading-underscore: true
    strings-as-attributes: true
    resource-tag-keys: [source, site, role, vendor]
    counter-patterns:
      - "octets|pkts|packets|errors|discards|drops|messages"
    event-processors: [now, states, numbers]
    resource-attributes:
      service.name: gnmic
      deployment.environment: hackathon
  prom:                          # local debug tap only; Elastic gets the OTLP output above
    type: prometheus
    listen: :9464
    path: /metrics
    metric-prefix: gnmi
    strings-as-labels: true
    event-processors: [now, states, numbers]
