# Keeps the Auto-SRE agent's knowledge base in sync with this repo's docs: on every push to
# docs/** (design docs) or generated/documentation/** (per-device docs, regenerated by `make
# build`), re-index them for semantic search (kb-docs index, .multilingual-e5-small-elasticsearch
# inference endpoint).
#
# The indexing logic (scripts/kb-ingest.sh) lives in chaos2cure-lab, which owns the knowledge base
# (see its CLAUDE.md); this workflow only triggers on the event only this repo receives (its own
# push) and checks that script out alongside this repo to run it. Credentials are the same
# ELASTIC_ES_URL / ELASTIC_API_KEY secrets deploy.yml already uses -- nothing new to provision.
name: kb-sync

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "generated/documentation/**"
  workflow_dispatch: {}

concurrency: netops-kb-sync

jobs:
  sync:
    runs-on: [self-hosted, netops-lab]
    env:
      ES_URL: ${{ secrets.ELASTIC_ES_URL }}
      ES_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: netops-lab
      - uses: actions/checkout@v4
        with:
          repository: Nipuna-saga/chaos2cure-lab
          path: chaos2cure-lab
      - name: Re-index docs/ and generated/documentation/ for semantic search
        run: |
          chaos2cure-lab/scripts/kb-ingest.sh netops-lab "$PWD/netops-lab" "$(cd netops-lab && git rev-parse HEAD)"
