# Merge to main == deploy.  Converge the lab to main, verify, record the change for the Auto-SRE agent.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore:             # chaos-lab is not part of the lab: changing it deploys nothing and records no change
      - "chaos-lab/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:                  # a newer deploy may replace a pending one: it converges to the newer main anyway.
  group: netops-deploy        # Lab access itself is serialised by the host lock in automation/lab.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, netops-lab]
    env:
      EOS_USER: ${{ secrets.EOS_USER }}
      EOS_PASSWORD: ${{ secrets.EOS_PASSWORD }}
      # Elastic (docs/elastic.md): the collector profile, change events and verify follow these.
      # Unset secrets = lab-local telemetry.  ELASTIC_OTLP_ENDPOINT is optional (Managed OTLP, later).
      ELASTIC_ES_URL: ${{ secrets.ELASTIC_ES_URL }}
      ELASTIC_OTLP_ENDPOINT: ${{ secrets.ELASTIC_OTLP_ENDPOINT }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and check generated files are committed
        run: make check-build
      - name: Re-wire the lab if its topology differs from main (else refresh the lab bundle)
        run: automation/lab converge
      - name: Apply (EOS config-replace, FRR reload, hosts)
        run: set -o pipefail; make apply 2>&1 | tee apply.log
      - name: Kubernetes (terraform apply)
        run: set -o pipefail; automation/k8s apply 2>&1 | tee -a apply.log
      - name: Verify
        run: automation/verify.sh --wait 420
      - name: Record change event
        if: always()
        run: automation/change-event.sh "${{ job.status }}" apply.log
