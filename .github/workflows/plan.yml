# PR gate: validate intent, prove generated files are committed, show the per-device diff.
name: plan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:                   # a new push to the PR supersedes its running plan.
  group: netops-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true       # Lab access is serialised by the host lock in automation/lab.
jobs:
  plan:
    runs-on: [self-hosted, netops-lab]
    env:
      EOS_USER: ${{ secrets.EOS_USER }}
      EOS_PASSWORD: ${{ secrets.EOS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (AVD schema validation) and check generated files are committed
        run: make check-build
      - name: Plan — per-device diff against the running lab
        run: set -o pipefail; make plan 2>&1 | tee plan.log
      - name: Post plan to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: automation/plan-report.sh plan.log | gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file -
  isolation:
    # The SRE agent must never learn about chaos-lab from the lab's own data: no PR mixes chaos-lab/ with lab
    # changes (its title would ride along into a change event), and nothing the agent reads mentions it.
    runs-on: [self-hosted, netops-lab]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: chaos-lab kept apart from the lab
        run: automation/isolation-check.sh "origin/${{ github.base_ref }}"
      - name: chaos-lab self-tests
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^chaos-lab/'; then
            make -C chaos-lab test
          else
            echo "chaos-lab unchanged"
          fi
