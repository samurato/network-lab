# Reconcile loop: detect when the running network diverges from main (manual change, fault, agent test).
name: drift
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:                  # own group, so a scheduled run can never cancel a pending deploy or plan.
  group: netops-drift         # Lab access is serialised by the host lock in automation/lab.
  cancel-in-progress: false
jobs:
  drift:
    runs-on: [self-hosted, netops-lab]
    env:
      EOS_USER: ${{ secrets.EOS_USER }}
      EOS_PASSWORD: ${{ secrets.EOS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan against main
        run: set -o pipefail; make plan 2>&1 | tee plan.log
      - name: Open / update drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(automation/plan-report.sh plan.log)   # counts real device changes, not local housekeeping
          if ! grep -q '^No device changes' <<<"$body"; then
            n=$(gh issue list --label drift --state open --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
            else gh issue create --label drift --title "Drift: running network differs from main" --body "$body"; fi
            exit 1
          fi
          echo "no drift"
