# Ops actions requested by the Chaos2Cure remediation gate (AWS Lambda), never run without a human.
# The gate already checked the action against the allow-list (chaos2cure-lab elastic/knowledge/actions.json);
# this workflow checks again, because anyone with dispatch rights can call it.
#   config     git.revert            opens a revert PR; the PR review is the approval, deploy.yml applies it
#   reconcile  gitops.redeploy       re-runs deploy.yml on main (converge everything to Git)
#              gitops.k8s-apply      Kubernetes Terraform apply only
#   run        k8s.uncordon | k8s.scale | k8s.rollout-restart
# reconcile and run pause on the `ops-approval` environment until a required reviewer approves.
# Inputs are only ever read from environment variables, never pasted into a shell line.
name: ops-action
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [git.revert, gitops.redeploy, gitops.k8s-apply, k8s.uncordon, k8s.scale, k8s.rollout-restart]
      params:
        description: 'JSON object, e.g. {"namespace":"kube-system","deployment":"coredns","replicas":1}'
        default: "{}"
      incident_id:
        default: manual
      reason:
        default: ""
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: netops-ops-action
  cancel-in-progress: false
env:
  ACTION: ${{ inputs.action }}
  PARAMS: ${{ inputs.params }}
  INCIDENT: ${{ inputs.incident_id }}
  REASON: ${{ inputs.reason }}
jobs:
  config:
    if: inputs.action == 'git.revert'
    runs-on: ubuntu-latest
    env:
      # A PR opened with GITHUB_TOKEN does not trigger plan.yml; OPS_PR_TOKEN (optional) makes it run.
      GH_TOKEN: ${{ secrets.OPS_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, token: "${{ secrets.OPS_PR_TOKEN || github.token }}"}
      - name: Open a revert PR
        run: |
          set -euo pipefail
          sha=$(jq -er '.sha | select(test("^[0-9a-f]{7,40}$"))' <<<"$PARAMS") || { echo "invalid sha"; exit 1; }
          git cat-file -e "$sha^{commit}" && git merge-base --is-ancestor "$sha" origin/main \
            || { echo "$sha is not a commit on main"; exit 1; }
          id=$(tr -cd 'A-Za-z0-9-' <<<"$INCIDENT" | cut -c1-40)
          branch="auto-sre/${id:-manual}-${sha:0:7}"
          git config user.name "chaos2cure-gate"; git config user.email "chaos2cure-gate@users.noreply.github.com"
          git switch -c "$branch" origin/main
          parents=$(git rev-list --parents -n1 "$sha" | wc -w)
          if [ "$parents" -gt 2 ]; then git revert --no-edit -m 1 "$sha"; else git revert --no-edit "$sha"; fi
          git push -u origin "$branch"
          body=$(printf 'Proposed by the Chaos2Cure agent for incident `%s`.\n\nReason: %s\n\nReverts %s. Review the plan comment, then merge to deploy.' "$INCIDENT" "$REASON" "$sha")
          gh pr create --base main --head "$branch" --title "Revert $(git log -1 --format=%s "$sha" | cut -c1-60) [$id]" --body "$body"

  act:
    if: inputs.action != 'git.revert'
    runs-on: [self-hosted, netops-lab]
    environment: ops-approval
    env:
      ELASTIC_ES_URL: ${{ secrets.ELASTIC_ES_URL }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          a, p = os.environ["ACTION"], json.loads(os.environ["PARAMS"] or "{}")
          ok_dep = {"prod": {"web", "redis"}, "kube-system": {"coredns"}}
          def fail(m): sys.exit(f"invalid params for {a}: {m}")
          if not isinstance(p, dict): fail("params must be an object")
          if a == "k8s.uncordon":
              n = p.get("nodes"); n = n.replace(",", " ").split() if isinstance(n, str) else n
              if not n or not all(re.fullmatch(r"(dc1|dc2|wan)-k8s-(cp|wk)[0-9]", str(x)) for x in n): fail("nodes")
          if a in ("k8s.scale", "k8s.rollout-restart") and p.get("deployment") not in ok_dep.get(p.get("namespace"), ()):
              fail("namespace/deployment")
          if a == "k8s.scale" and not (type(p.get("replicas")) is int and 1 <= p["replicas"] <= 8): fail("replicas")
          print(f"ok: {a} {p}")
          EOF
      - name: Run
        run: |
          set -euo pipefail
          ns=$(jq -r '.namespace // empty' <<<"$PARAMS"); dep=$(jq -r '.deployment // empty' <<<"$PARAMS")
          case "$ACTION" in
            gitops.redeploy)     gh workflow run deploy.yml --ref main; echo "deploy.yml dispatched on main" ;;
            gitops.k8s-apply)    automation/k8s apply ;;
            k8s.uncordon)        for n in $(jq -r '.nodes | if type == "array" then .[] else gsub(","; " ") end' <<<"$PARAMS"); do
                                   automation/k8s kubectl uncordon -- "$n"; done ;;
            k8s.scale)           automation/k8s kubectl -n "$ns" scale "deployment/$dep" --replicas="$(jq -r .replicas <<<"$PARAMS")" ;;
            k8s.rollout-restart) automation/k8s kubectl -n "$ns" rollout restart "deployment/$dep" ;;
          esac
      - name: Record change event
        if: always()
        run: |
          source automation/elastic-env.sh
          event=$(jq -nc --arg ts "$(date -u +%FT%TZ)" --arg a "$ACTION" --arg p "$PARAMS" --arg i "$INCIDENT" \
            --arg r "$REASON" --arg s "${{ job.status }}" --arg by "${{ github.triggering_actor }}" \
            --arg sha "$(git rev-parse HEAD)" --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"@timestamp":$ts, event:{kind:"event", category:["configuration"], type:["change"], outcome:$s},
              git:{sha:$sha, message:("ops-action " + $a + " " + $p), author:$by},
              netops:{source:"ops-action", action:$a, params:$p, incident_id:$i, reason:$r, run:$run, changed_devices:[]}}')
          echo "$event" >> "$HOME/netops-changes.jsonl"
          if [[ -n "${ELASTIC_ES_URL:-}" && -n "${ELASTIC_API_KEY:-}" ]]; then
            curl -sf -X POST "$ELASTIC_ES_URL/logs-netops.changes-default/_doc" -H "Authorization: ApiKey $ELASTIC_API_KEY" \
              -H 'content-type: application/json' -d "$event" >/dev/null && echo "change event sent to Elastic" \
              || echo "WARN: could not send change event to Elastic"
          fi
          echo "$event"
